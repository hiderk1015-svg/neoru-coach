<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#d94f8a">
<title>ネオルコーチ</title>
<style>
:root{--bg:#fff7fb;--card:#fff;--text:#2e2430;--muted:#7f6f7b;--accent:#d94f8a;--accent2:#f5d3e2;--ok:#4e9a72;--line:#ead8e1;--shadow:0 10px 30px rgba(70,30,50,.10)}
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:linear-gradient(180deg,#fff7fb,#fff);color:var(--text);min-height:100vh}
.wrap{max-width:600px;margin:auto;padding:18px 15px 48px} h1{font-size:29px;margin:8px 0 4px}
.lead{margin:0 0 12px;color:var(--muted);line-height:1.6}.date{font-weight:700;color:var(--accent);margin-bottom:14px}
.card{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:18px;margin:14px 0}.hero{background:linear-gradient(135deg,#fff,#ffe9f2)}
.hero-title{font-size:22px;font-weight:800;margin:3px 0 6px}.muted{color:var(--muted);line-height:1.55}
.row{display:flex;gap:10px}.row>*{flex:1}.stat{text-align:center;padding:11px 8px;border-radius:16px;background:#fff8fb}.stat strong{display:block;font-size:24px;color:var(--accent)}
.progress-wrap{height:10px;border-radius:999px;background:#f1e4ea;overflow:hidden;margin-top:14px}.progress{height:100%;width:0;background:var(--accent);transition:.25s}
.section-title{font-size:20px;font-weight:800;margin:20px 2px 4px}
.exercise{border:1px solid var(--line);box-shadow:none;padding:16px}.exercise.done{background:#edf8f2;border-color:#cae8d7}
.exercise-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.exercise-name{font-size:18px;font-weight:800;line-height:1.4}
.duration{flex:0 0 auto;font-size:13px;font-weight:800;color:#7b2f52;background:var(--accent2);padding:5px 9px;border-radius:999px}
.timer{text-align:center;font-size:42px;font-variant-numeric:tabular-nums;font-weight:800;margin:14px 0 8px}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:9px}.primary,.secondary{width:100%;border-radius:14px;padding:12px 10px;font-weight:800;font:inherit}
.primary{border:0;background:var(--accent);color:#fff}.secondary{border:1px solid var(--line);background:#fff;color:var(--text)}
.status{min-height:20px;text-align:center;color:var(--muted);font-size:13px;font-weight:700;margin-top:9px}.done .status{color:var(--ok)}
.small{font-size:13px;color:var(--muted);line-height:1.55}
</style>
</head>
<body>
<div class="wrap">
  <h1>ネオルコーチ</h1>
  <p class="lead">顔と首のエクササイズを、決めた時間で毎日続けるためのタイマー。</p>
  <div class="date" id="todayDate"></div>

  <div class="card hero">
    <div class="hero-title">今日のメニュー</div>
    <div class="muted">全部で23分50秒。ひとつずつ終わらせればOK。</div>
    <div class="progress-wrap"><div class="progress" id="progressBar"></div></div>
  </div>

  <div class="card">
    <div class="row">
      <div class="stat"><strong id="todayCount">0</strong>今日完了</div>
      <div class="stat"><strong id="streak">0</strong>連続日</div>
      <div class="stat"><strong id="totalCount">0</strong>累計</div>
    </div>
  </div>

  <div class="section-title">今日のエクササイズ</div>
  <div id="exerciseList"></div>

  <div class="card"><div class="small">
    スタートすると、各エクササイズではBGMが、「なのいうえお」ではテンポ音がタイマーと一緒に流れます。タイマーが0になると自動で完了します。途中で止めたいときは「一時停止」、最初からやり直すときは「リセット」を使ってください。完了記録はこの端末内に保存されます。
  </div></div>
</div>

<script>
const exercises=[
{id:"neck1",name:"首のエクササイズ1",seconds:40},
{id:"neck2",name:"首のエクササイズ2",seconds:40},
{id:"neck3",name:"首のエクササイズ3",seconds:40},
{id:"neckL",name:"首のストレッチ 左",seconds:30},
{id:"neckR",name:"首のストレッチ 右",seconds:30},
{id:"forehead",name:"おでこのエクササイズ",seconds:300},
{id:"nose",name:"鼻の横のエクササイズ",seconds:300},
{id:"eye",name:"目の下のエクササイズ",seconds:300},
{id:"nano",name:"なのいうえお",seconds:300}
];
const timers={},KEY="neoruFaceCoachV1";
const dayKey=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const fmt=s=>`${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;
const dur=s=>s<60?`${s}秒`:`${Math.floor(s/60)}分${s%60?`${s%60}秒`:""}`;
function data(){try{return JSON.parse(localStorage.getItem(KEY))||{total:0,days:{}}}catch(e){return{total:0,days:{}}}}
function save(d){localStorage.setItem(KEY,JSON.stringify(d))}
function setDone(id,val){
  const d=data(),k=dayKey(); d.days[k]=d.days[k]||{}; const was=!!d.days[k][id];
  if(val&&!was){d.days[k][id]=true;d.total=(d.total||0)+1}
  if(!val&&was){delete d.days[k][id];d.total=Math.max(0,(d.total||0)-1)}
  save(d); updateStats();
}
function renderDate(){
 const d=new Date(),w=["日","月","火","水","木","金","土"];
 todayDate.textContent=`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（${w[d.getDay()]}）`;
}
function render(){
  const done=(data().days[dayKey()]||{}),list=document.getElementById("exerciseList");
  list.innerHTML="";
  exercises.forEach(ex=>{
    timers[ex.id]={remaining:ex.seconds,running:false,interval:null};
    const c=document.createElement("div");
    c.className="card exercise"+(done[ex.id]?" done":""); c.id="card-"+ex.id;
    c.innerHTML=`<div class="exercise-head"><div class="exercise-name">${ex.name}</div><div class="duration">${dur(ex.seconds)}</div></div>
    <div class="timer" id="timer-${ex.id}">${fmt(ex.seconds)}</div>
    <div class="buttons"><button class="primary" id="start-${ex.id}">スタート</button><button class="secondary" id="reset-${ex.id}">リセット</button></div>
    <div class="status" id="status-${ex.id}">${done[ex.id]?"完了":""}</div>`;
    list.appendChild(c);
    document.getElementById("start-"+ex.id).onclick=()=>toggle(ex);
    document.getElementById("reset-"+ex.id).onclick=()=>reset(ex);
  })
}
let audioCtx=null, audioMaster=null, audioNodes=[], audioSchedule=null;
function ensureAudio(){
 const A=window.AudioContext||window.webkitAudioContext;
 if(!A)return null;
 if(!audioCtx) audioCtx=new A();
 if(audioCtx.state==="suspended") audioCtx.resume();
 return audioCtx;
}
function stopAudio(){
 if(audioSchedule){clearInterval(audioSchedule);audioSchedule=null}
 audioNodes.forEach(n=>{try{n.stop()}catch(e){};try{n.disconnect()}catch(e){}}); audioNodes=[];
 if(audioMaster){try{audioMaster.disconnect()}catch(e){};audioMaster=null}
}
function tone(freq,start,dur=.16,vol=.035,type="sine"){
 const c=audioCtx,o=c.createOscillator(),g=c.createGain();
 o.type=type;o.frequency.value=freq;o.connect(g);g.connect(audioMaster);
 g.gain.setValueAtTime(.0001,start);g.gain.exponentialRampToValueAtTime(vol,start+.015);g.gain.exponentialRampToValueAtTime(.0001,start+dur);
 o.start(start);o.stop(start+dur+.02);audioNodes.push(o);
}
function startBgm(){
 stopAudio();const c=ensureAudio();if(!c)return;
 audioMaster=c.createGain();audioMaster.gain.value=.65;audioMaster.connect(c.destination);
 // Gentle original loop: soft major-7 / add9 arpeggios, no vocals.
 const chords=[[261.63,329.63,392.00,493.88],[220.00,261.63,329.63,392.00],[174.61,220.00,261.63,329.63],[196.00,246.94,293.66,392.00]];
 const schedule=(base)=>{for(let bar=0;bar<4;bar++){const ch=chords[bar];for(let i=0;i<8;i++){tone(ch[i%4],base+bar*4+i*.5,.38,.026); if(i===0)tone(ch[0]/2,base+bar*4,.8,.018)}}};
 let next=c.currentTime+.05;schedule(next);next+=16;
 audioSchedule=setInterval(()=>{if(c.currentTime>next-5){schedule(next);next+=16}},1000);
}
function startTempo(){
 stopAudio();const c=ensureAudio();if(!c)return;
 audioMaster=c.createGain();audioMaster.gain.value=.8;audioMaster.connect(c.destination);
 // 6 beats, about 0.53 sec apart; then about 2 sec before the next set.
 const cycle=4.65, beat=.53;
 const schedule=(base)=>{for(let set=0;set<4;set++){let b=base+set*cycle;for(let i=0;i<6;i++)tone(i===5?880:660,b+i*beat,.10,i===5?.05:.035,"sine")}};
 let next=c.currentTime+.05;schedule(next);next+=cycle*4;
 audioSchedule=setInterval(()=>{if(c.currentTime>next-5){schedule(next);next+=cycle*4}},1000);
}
function startExerciseAudio(ex){ if(ex.id==="nano")startTempo(); else startBgm() }
function toggle(ex){
 const s=timers[ex.id],b=document.getElementById("start-"+ex.id),st=document.getElementById("status-"+ex.id);
 if(s.running){clearInterval(s.interval);s.running=false;stopAudio();b.textContent="再開";st.textContent="一時停止中";return}
 if(s.remaining<=0) reset(ex);
 s.running=true;b.textContent="一時停止";st.textContent="実行中";startExerciseAudio(ex);
 s.interval=setInterval(()=>{s.remaining--;document.getElementById("timer-"+ex.id).textContent=fmt(s.remaining);
 if(s.remaining<=0){clearInterval(s.interval);s.running=false;finish(ex)}},1000)
}
function finish(ex){
 stopAudio();
 document.getElementById("start-"+ex.id).textContent="もう一度";
 document.getElementById("status-"+ex.id).textContent="完了";
 document.getElementById("card-"+ex.id).classList.add("done"); setDone(ex.id,true);
 try{const A=window.AudioContext||window.webkitAudioContext;if(A){const c=new A(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.setValueAtTime(.12,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.5);o.start();o.stop(c.currentTime+.5)}}catch(e){}
}
function reset(ex){
 const s=timers[ex.id]; if(s.running)stopAudio(); if(s.interval)clearInterval(s.interval); s.running=false;s.remaining=ex.seconds;
 document.getElementById("timer-"+ex.id).textContent=fmt(ex.seconds);
 document.getElementById("start-"+ex.id).textContent="スタート";
 document.getElementById("status-"+ex.id).textContent="";
 document.getElementById("card-"+ex.id).classList.remove("done"); setDone(ex.id,false);
}
function updateStats(){
 const d=data(),today=d.days[dayKey()]||{},count=exercises.filter(x=>today[x.id]).length;
 todayCount.textContent=count;totalCount.textContent=d.total||0;progressBar.style.width=Math.round(count/exercises.length*100)+"%";
 let n=0,dt=new Date();
 while(true){const v=d.days[dayKey(dt)]||{};if(Object.values(v).some(Boolean)){n++;dt.setDate(dt.getDate()-1)}else break}
 streak.textContent=n;
}
renderDate();render();updateStats();
</script>
</body>
</html>
